# Quality gates of QD-V433-COMPLIANCE §1 (Spec V4.3.3 §29.1, §32).
# Actions are pinned by full commit SHA, never by tag: a tag can be moved to
# malicious code (CVE-2025-30066, tj-actions/changed-files). The comment after
# each pin names the release it resolves to.
#
# Until kariricode/contract 2.11.0 is tagged, "composer install" cannot
# resolve the dependency and this workflow is expected to fail (QD §5).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer check-platform-reqs
      - run: composer cs-check
      - run: composer phpstan
      - run: composer psalm
      - run: composer complexity
      - run: composer test -- --fail-on-skipped
      - run: composer test-conformance
      - run: composer security
      - run: composer infection
      - run: composer sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
