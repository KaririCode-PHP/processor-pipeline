# Release gate (Spec V4.3.3 §29.1, §32). A version tag reruns every quality
# gate, then publishes a GitHub release with that version's section of
# CHANGELOG.md and the CycloneDX SBOM. Actions are pinned by full commit SHA;
# the comment after each pin names the release it resolves to. Release tags
# are signed by the maintainer (git tag -s) and checked with git tag -v.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  KCODE_VERSION: 1.2.1
  KCODE_SHA256: 1bc43b06798b4e7fc1df341cc505f316549f0dd5efb9c8d80031415b0cdf3e3b

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install kcode ${{ env.KCODE_VERSION }}, checksum verified
        run: |
          curl -fsSLo kcode.phar "https://github.com/KaririCode-PHP/devkit/releases/download/v${KCODE_VERSION}/kcode.phar"
          echo "${KCODE_SHA256}  kcode.phar" | sha256sum -c -
          sudo install -m 0755 kcode.phar /usr/local/bin/kcode
      - run: kcode init
      - run: composer check
      - run: composer infection
      - run: composer sbom
      - name: Extract this version's notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [${version}]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${version}" >&2; exit 1; }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: KaririCode ProcessorPipeline ${{ github.ref_name }}
          body_path: release-notes.md
          files: sbom.cdx.json
          fail_on_unmatched_files: true
